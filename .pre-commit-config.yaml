repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: ["--fix"]
        stages: [pre-commit]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: ruff-check
        args: []
        stages: [pre-push]
