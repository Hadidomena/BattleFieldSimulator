repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff-check
        entry: venv/Scripts/ruff.exe check --fix --unsafe-fixes
        language: system
        types: [python]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff-format
        entry: venv/Scripts/ruff.exe format
        language: system
        types: [python]
        require_serial: true
        stages: [pre-commit]

      - id: python-compile
        name: python-compile
        entry: venv/Scripts/python.exe -m py_compile
        language: system
        types: [python]
        stages: [pre-commit]
