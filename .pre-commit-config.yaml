repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff-check
        entry: ruff check --fix --unsafe-fixes
        language: system
        types: [python]
        require_serial: true
        stages: [pre-commit]
        
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
        require_serial: true
        stages: [pre-commit]

      - id: python-compile
        name: python-compile
        entry: python -m py_compile
        language: system
        types: [python]
        stages: [pre-commit]
